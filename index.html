<script> //dont look at this
    (function () {
        var API = "https://hitscounter.dev/api/hit?output=json&url=https://team-alkes.github.io/clubhous/";

        fetch(API)
            .then(function (r) { return r.json(); })
            .then(function (data) {
                var digits = String(data.total_hits).padStart(6, "0").split("");
                var imgs = document.querySelectorAll(".pagecounter .digit");
                digits.forEach(function (d, i) {
                    imgs[i].src = "images/pagecounter/" + d + ".gif";
                });
            })
    })();
</script>

<script> //dont look in here. be free. its 1995 bro. don't worry about it.
    (function () {
        const SPEED = 3;

        function pixelLoad(img) {
            if (!img.classList.contains('pixel')) return;
            const run = () => animate(img);
            if (img.complete && img.naturalWidth) run();
            else img.addEventListener('load', run, { once: true });
        }

        function animate(img) {
            const W = img.naturalWidth, H = img.naturalHeight;
            if (!W || !H) return;

            const rect = img.getBoundingClientRect();
            const dispW = rect.width || W;
            const dispH = rect.height || H;

            const cv = document.createElement('canvas');
            cv.width = W; cv.height = H;
            cv.style.width = dispW + 'px';
            cv.style.height = dispH + 'px';
            cv.style.imageRendering = 'pixelated';
            cv.style.verticalAlign = 'bottom';

            const prevDisplay = img.style.display;
            img.parentNode.insertBefore(cv, img);
            img.style.display = 'none';

            const ctx = cv.getContext('2d');
            const off = document.createElement('canvas');
            const octx = off.getContext('2d');

            let pct = 0;
            const t0 = performance.now();
            let nextStall = (1500 + Math.random() * 1500) * SPEED;
            let stallUntil = 0;

            function draw(p) {
                const rows = Math.round(H * p / 100);
                const f = p < 60 ? 0.5 : 1;
                const sw = Math.max(1, Math.round(W * f));
                const sh = Math.max(1, Math.round(H * f));
                off.width = sw; off.height = sh;
                octx.imageSmoothingEnabled = false;
                octx.clearRect(0, 0, sw, sh);
                octx.drawImage(img, 0, 0, sw, sh);
                ctx.imageSmoothingEnabled = false;
                ctx.clearRect(0, 0, W, H);
                if (rows > 0) {
                    const srcRows = Math.round(sh * p / 100);
                    ctx.drawImage(off, 0, 0, sw, srcRows, 0, 0, W, rows);
                }
            }

            function frame(now) {
                if (pct < 100) {
                    if (now >= stallUntil) {
                        const ramp = pct < 8 ? 0.25 : 1;
                        pct += (0.10 + Math.random() * 0.55) * ramp / SPEED;
                        if (pct > 100) pct = 100;
                        if (now - t0 > nextStall) {
                            stallUntil = now + (300 + Math.random() * 1400) * SPEED;
                            nextStall = (now - t0) + (1500 + Math.random() * 2500) * SPEED;
                        }
                    }
                }
                draw(pct);
                if (pct >= 100) {
                    cv.remove();
                    img.style.display = prevDisplay;
                    return;
                }
                requestAnimationFrame(frame);
            }
            requestAnimationFrame(frame);
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('img').forEach(pixelLoad);
        });
    })();
</script>
