<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf8">
    <title>Team Alkes Clubhouse</title>
    <style>
        .pagecounter img {
            display: block;
            float: left;
            margin: 0;
            padding: 0;
        }

        .pagecounter {
            display: inline-block;
            transform: scale(0.7);
            transform-origin: center;
        }

        img.pixel {
            --progress: 0%;
            clip-path: inset(0 0 calc(100% - var(--progress)) 0);
            image-rendering: pixelated; 
        }

        img.pixel.done {
            clip-path: none;
            image-rendering: auto;
        }
    </style>
</head>

<script> //dont look at this
    (function () {
        var API = "https://hitscounter.dev/api/hit?output=json&url=https://team-alkes.github.io/clubhouse";

        fetch(API)
            .then(function (r) { return r.json(); })
            .then(function (data) {
                var digits = String(data.total_hits).padStart(6, "0").split("");
                var imgs = document.querySelectorAll(".pagecounter .digit");
                digits.forEach(function (d, i) {
                    imgs[i].src = "images/pagecounter/" + d + ".gif";
                });
            })
    })();
</script>

<script> //dont look in here. be free. its 1995 bro. don't worry about it.
    (function () {
        function simulateDialUp(img) {
            if (!img.classList.contains('pixel')) return;

            let progress = 0;
            
            function downloadChunk() {
                progress += Math.random() * 6 + 1; 
                if (progress >= 100) progress = 100;
                
                img.style.setProperty('--progress', `${progress}%`);
                
                if (progress < 100) {
                    setTimeout(downloadChunk, Math.random() * 950 + 50);
                } else {
                    img.classList.add('done');
                }
            }
            
            if (img.complete && img.naturalWidth) {
                downloadChunk();
            } else {
                img.addEventListener('load', downloadChunk, { once: true });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('img').forEach(simulateDialUp);
        });
    })();
</script>
